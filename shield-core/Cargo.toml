[package]
name = "shield-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled", "time", "uuid"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
base64 = "0.22"
thiserror = "2.0"
log = "0.4"
ring = "0.17"
sha2 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
subtle = "2.6"
hex = "0.4"
